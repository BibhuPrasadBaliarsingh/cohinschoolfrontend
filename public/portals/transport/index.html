<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RouteSafe TMS | Cohen International School – Transport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .card-hover { transition: all 0.2s ease; }
    @media (hover: hover) {
      .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1); }
    }
    #map { height: 320px; border-radius: 12px; z-index: 1; }
    @media (min-width: 768px) { #map { height: 420px; } }
    .leaflet-container { font-family: inherit; }
    .nav-item.active { background: linear-gradient(90deg, #2563eb, #1d4ed8); color: white; }
    .nav-item.active i { color: white; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .badge-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* Mobile sidebar */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 280px;
      max-width: 85vw;
    }
    #sidebar.open { transform: translateX(0); }
    @media (min-width: 1024px) {
      #sidebar {
        position: relative;
        transform: none !important;
        width: 16rem;
        max-width: none;
        flex-shrink: 0;
      }
    }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 40;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(2px);
    }
    #overlay.show { opacity: 1; pointer-events: auto; }

    /* Prevent body scroll when menu open */
    body.menu-open { overflow: hidden; }

    /* Better touch targets */
    .nav-item { min-height: 44px; }

    /* Horizontal scroll for tables on mobile */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap table { min-width: 640px; }

    /* Safe area for notched phones */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <!-- Mobile Overlay -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <div id="app" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-900 text-slate-300 flex flex-col shadow-2xl lg:shadow-none">
      <div class="p-5 border-b border-slate-700/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
            <i data-lucide="bus" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="text-white font-bold text-lg leading-tight">RouteSafe</h1>
            <p class="text-xs text-slate-400">School Transport TMS</p>
          </div>
        </div>
        <!-- Close button (mobile only) -->
        <button onclick="closeSidebar()" class="lg:hidden p-2 -mr-2 text-slate-400 hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto sidebar-scroll py-4 px-3 space-y-0.5">
        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-1">Main</p>
        <button onclick="showPage('dashboard')" class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="dashboard">
          <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i> <span>Dashboard</span>
        </button>
        <button onclick="showPage('gps')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="gps">
          <i data-lucide="map-pin" class="w-5 h-5 flex-shrink-0"></i> <span>Live GPS Tracking</span>
        </button>
        <button onclick="showPage('attendance')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="attendance">
          <i data-lucide="clipboard-check" class="w-5 h-5 flex-shrink-0"></i> <span>Attendance</span>
        </button>

        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Management</p>
        <button onclick="showPage('students')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="students">
          <i data-lucide="graduation-cap" class="w-5 h-5 flex-shrink-0"></i> <span>Students</span>
        </button>
        <button onclick="showPage('drivers')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="drivers">
          <i data-lucide="user-round" class="w-5 h-5 flex-shrink-0"></i> <span>Drivers</span>
        </button>
        <button onclick="showPage('buses')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="buses">
          <i data-lucide="bus" class="w-5 h-5 flex-shrink-0"></i> <span>Buses</span>
        </button>
        <button onclick="showPage('routes')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="routes">
          <i data-lucide="route" class="w-5 h-5 flex-shrink-0"></i> <span>Routes</span>
        </button>

        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Operations</p>
        <button onclick="showPage('fuel')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="fuel">
          <i data-lucide="fuel" class="w-5 h-5 flex-shrink-0"></i> <span>Fuel Management</span>
        </button>
        <button onclick="showPage('maintenance')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="maintenance">
          <i data-lucide="wrench" class="w-5 h-5 flex-shrink-0"></i> <span>Maintenance</span>
        </button>
        <button onclick="showPage('expenses')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="expenses">
          <i data-lucide="wallet" class="w-5 h-5 flex-shrink-0"></i> <span>Expenses</span>
        </button>

        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Insights</p>
        <button onclick="showPage('reports')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="reports">
          <i data-lucide="bar-chart-3" class="w-5 h-5 flex-shrink-0"></i> <span>Reports</span>
        </button>
        <button onclick="showPage('notifications')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="notifications">
          <i data-lucide="bell" class="w-5 h-5 flex-shrink-0"></i> <span>Notifications</span>
        </button>
        <button onclick="showPage('settings')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="settings">
          <i data-lucide="settings" class="w-5 h-5 flex-shrink-0"></i> <span>Admin Settings</span>
        </button>
      </nav>

      <div class="p-4 border-t border-slate-700/50 safe-bottom space-y-3">
        <a href="../../index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to School Website
        </a>
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center text-white font-bold text-sm">A</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-white truncate">Admin User</p>
            <p class="text-xs text-slate-400 truncate">School Admin</p>
          </div>
          <button class="p-2 hover:bg-slate-800 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden w-full min-w-0">
      <!-- Top Bar -->
      <header class="h-14 md:h-16 bg-white border-b border-slate-200 flex items-center justify-between px-3 sm:px-4 md:px-6 flex-shrink-0 z-30">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <button id="menu-toggle" onclick="toggleSidebar()" class="lg:hidden p-2.5 -ml-1 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition">
            <i data-lucide="menu" class="w-5 h-5 text-slate-700"></i>
          </button>
          <div class="min-w-0">
            <h2 id="page-title" class="text-base sm:text-lg font-semibold text-slate-800 truncate">Dashboard</h2>
            <p id="page-subtitle" class="text-[11px] sm:text-xs text-slate-500 truncate hidden xs:block sm:block">Overview of your school transport operations</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
          <!-- Search - hidden on very small screens -->
          <div class="relative hidden md:block">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" placeholder="Search..." class="pl-9 pr-4 py-2 w-48 lg:w-64 text-sm bg-slate-100 border-0 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
          </div>
          <button class="relative p-2.5 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition">
            <i data-lucide="bell" class="w-5 h-5 text-slate-600"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full badge-pulse"></span>
          </button>
          <div class="hidden sm:flex items-center gap-1.5 text-xs text-slate-500 pl-1">
            <span class="w-2 h-2 bg-emerald-500 rounded-full flex-shrink-0"></span>
            <span class="font-medium hidden lg:inline">Online</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 md:p-6 bg-slate-50 safe-bottom">
        <!-- Pages injected here -->
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-3 left-3 sm:left-auto sm:right-6 z-[60] space-y-2 pointer-events-none"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
