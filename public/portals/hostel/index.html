<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HostelFlow | Cohen International School | School Hostel Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#fdf4ff',100:'#fae8ff',200:'#f5d0fe',300:'#f0abfc',400:'#e879f9',500:'#d946ef',600:'#c026d3',700:'#a21caf',800:'#86198f',900:'#701a75' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .card-hover { transition: all 0.2s ease; }
    @media (hover:hover) { .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08); } }
    .nav-item.active { background: linear-gradient(90deg, #a21caf, #86198f); color: white; }
    .nav-item.active i { color: white; }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .badge-pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    #sidebar {
      position: fixed; top:0; left:0; bottom:0; z-index:50;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      width: 280px; max-width: 85vw;
    }
    #sidebar.open { transform: translateX(0); }
    @media (min-width: 1024px) {
      #sidebar { position: relative; transform: none !important; width: 16rem; max-width: none; flex-shrink: 0; }
    }
    #overlay {
      position: fixed; inset:0; background: rgba(15,23,42,0.55); z-index:40;
      opacity:0; pointer-events:none; transition: opacity 0.3s ease; backdrop-filter: blur(2px);
    }
    #overlay.show { opacity:1; pointer-events:auto; }
    body.menu-open { overflow: hidden; }
    .nav-item { min-height: 44px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap table { min-width: 640px; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="overlay" onclick="closeSidebar()"></div>

  <div id="app" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-900 text-slate-300 flex flex-col shadow-2xl lg:shadow-none">
      <div class="p-5 border-b border-slate-700/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-fuchsia-500 to-purple-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30">
            <i data-lucide="building-2" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="text-white font-bold text-lg leading-tight">HostelFlow | Cohen International School</h1>
            <p class="text-xs text-slate-400">School Hostel System</p>
          </div>
        </div>
        <button onclick="closeSidebar()" class="lg:hidden p-2 -mr-2 text-slate-400 hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto sidebar-scroll py-4 px-3 space-y-0.5">
        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Main</p>
        <button onclick="showPage('dashboard')" class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="dashboard">
          <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i> <span>Dashboard</span>
        </button>
        <button onclick="showPage('boarders')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="boarders">
          <i data-lucide="users" class="w-5 h-5 flex-shrink-0"></i> <span>Boarders</span>
        </button>
        <button onclick="showPage('rooms')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="rooms">
          <i data-lucide="door-open" class="w-5 h-5 flex-shrink-0"></i> <span>Rooms & Allocation</span>
        </button>

        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">Operations</p>
        <button onclick="showPage('attendance')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="attendance">
          <i data-lucide="clipboard-check" class="w-5 h-5 flex-shrink-0"></i> <span>Night Attendance</span>
        </button>
        <button onclick="showPage('mess')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="mess">
          <i data-lucide="utensils" class="w-5 h-5 flex-shrink-0"></i> <span>Mess Management</span>
        </button>
        <button onclick="showPage('fees')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="fees">
          <i data-lucide="wallet" class="w-5 h-5 flex-shrink-0"></i> <span>Hostel Fees</span>
        </button>
        <button onclick="showPage('leave')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="leave">
          <i data-lucide="log-out" class="w-5 h-5 flex-shrink-0"></i> <span>Leave / Outing</span>
        </button>

        <p class="px-3 text-[10px] font-semibold text-slate-500 uppercase tracking-wider mt-5 mb-2">More</p>
        <button onclick="showPage('visitors')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="visitors">
          <i data-lucide="user-plus" class="w-5 h-5 flex-shrink-0"></i> <span>Visitors</span>
        </button>
        <button onclick="showPage('complaints')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="complaints">
          <i data-lucide="message-square-warning" class="w-5 h-5 flex-shrink-0"></i> <span>Complaints</span>
        </button>
        <button onclick="showPage('staff')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="staff">
          <i data-lucide="shield" class="w-5 h-5 flex-shrink-0"></i> <span>Staff / Wardens</span>
        </button>
        <button onclick="showPage('reports')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all hover:bg-slate-800" data-page="reports">
          <i data-lucide="bar-chart-3" class="w-5 h-5 flex-shrink-0"></i> <span>Reports</span>
        </button>
      </nav>

      <div class="p-4 border-t border-slate-700/50 safe-bottom space-y-3">
        <a href="../../index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to School Website
        </a>
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-fuchsia-400 to-purple-500 flex items-center justify-center text-white font-bold text-sm">RW</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-white truncate">Ramesh Warden</p>
            <p class="text-xs text-slate-400 truncate">Chief Warden</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden w-full min-w-0">
      <header class="h-14 md:h-16 bg-white border-b border-slate-200 flex items-center justify-between px-3 sm:px-4 md:px-6 flex-shrink-0 z-30">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <button onclick="toggleSidebar()" class="lg:hidden p-2.5 -ml-1 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition">
            <i data-lucide="menu" class="w-5 h-5 text-slate-700"></i>
          </button>
          <div class="min-w-0">
            <h2 id="page-title" class="text-base sm:text-lg font-semibold text-slate-800 truncate">Dashboard</h2>
            <p id="page-subtitle" class="text-[11px] sm:text-xs text-slate-500 truncate hidden sm:block">Hostel overview & operations</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
          <div class="hidden md:flex items-center gap-2 text-xs bg-fuchsia-50 text-fuchsia-700 px-3 py-1.5 rounded-full font-medium">
            <span class="w-1.5 h-1.5 bg-fuchsia-500 rounded-full"></span>
            Boys Hostel A
          </div>
          <button class="relative p-2.5 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition">
            <i data-lucide="bell" class="w-5 h-5 text-slate-600"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full badge-pulse"></span>
          </button>
        </div>
      </header>

      <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 md:p-6 bg-slate-50 safe-bottom"></main>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-3 left-3 sm:left-auto sm:right-6 z-[60] space-y-2 pointer-events-none"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
