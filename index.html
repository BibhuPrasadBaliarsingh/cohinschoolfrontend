    <style>
      @keyframes fastSpin {
        0% { transform: rotate(0deg); }

        width: 56px;
        height: 56px;
        border: 4px solid rgba(201, 162, 39, 0.2);
        border-top-color: #E8C547;
        border-right-color: #C9A227;
        border-radius: 50%;
        animation: fastSpin 0.75s linear infinite;
        box-shadow: 0 0 20px rgba(201, 162, 39, 0.3);
      }
    </style>
  </head>
